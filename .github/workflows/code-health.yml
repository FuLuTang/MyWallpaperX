name: Code Health

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-health-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-file-ratchet:
    name: Swift file-size ratchet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Swift file health
        env:
          PUSH_BASE: ${{ github.event.before }}
        run: |
          python3 -B -m unittest script/tests/test_check_code_health.py
          BASE_REF="${PUSH_BASE}"
          if [ -z "${BASE_REF}" ] || [[ "${BASE_REF}" =~ ^0+$ ]]; then
            git fetch --no-tags origin main
            BASE_REF="$(git merge-base HEAD origin/main)"
          fi
          python3 script/check_code_health.py --check --base-ref "${BASE_REF}" --format github
